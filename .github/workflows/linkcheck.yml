# Checks every source and county alert link on the 1st of each month (and on demand).
# If any are broken, it opens an issue labeled "links", or updates the open one; a clean run closes it.
name: Link check

on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links
        id: check
        run: |
          if node scripts/linkcheck.js > report.md; then echo "broken=0" >> "$GITHUB_OUTPUT"; else echo "broken=1" >> "$GITHUB_OUTPUT"; fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: File or update the issue
        if: steps.check.outputs.broken == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create links --color FBCA04 --description "Broken outside links" --force
          num=$(gh issue list --label links --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body-file report.md; gh issue comment "$num" --body "Updated by the $(date +%B) link check."
          else gh issue create --title "Broken links" --label links --body-file report.md; fi
      - name: Close the issue when everything passes
        if: steps.check.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --label links --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue close "$num" --comment "The $(date +%B) link check found no broken links."; fi
